<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gp-One</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/GpOne.Shared/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="_content/GpOne.Shared/app.css" />
    <link rel="stylesheet" href="GpOne.Desktop.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="splash" class="splash" aria-hidden="true">
        <div class="splash-content">
            <div class="splash-logo">Gp-One AI</div>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Blazor viene avviato dal BlazorWebView: la splash si chiude quando #app riceve contenuto -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        (function () {
            const app = document.getElementById('app');
            const splash = document.getElementById('splash');
            const minDuration = new Promise(resolve => setTimeout(resolve, 1500));
            const rendered = new Promise(resolve => {
                const observer = new MutationObserver(() => {
                    if (app.childElementCount > 0) { observer.disconnect(); resolve(); }
                });
                observer.observe(app, { childList: true });
            });

            Promise.all([minDuration, rendered]).then(() => {
                splash.classList.add('splash-hide');
                splash.addEventListener('transitionend', () => splash.remove(), { once: true });
            });
        })();
    </script>
</body>

</html>
