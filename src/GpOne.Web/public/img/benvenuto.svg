<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Domande e grafici">
  <defs>
    <linearGradient id="vp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="po" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#ffa53d"/>
    </linearGradient>
    <linearGradient id="ct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c3ee"/>
      <stop offset="1" stop-color="#2dd4a7"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5b2bd6" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- macchie di colore sullo sfondo -->
  <circle cx="90" cy="110" r="78" fill="#7c4dff" opacity=".12"/>
  <circle cx="270" cy="90" r="64" fill="#ff4f8b" opacity=".12"/>
  <circle cx="230" cy="190" r="46" fill="#ffa53d" opacity=".14"/>

  <!-- fumetto della domanda -->
  <g filter="url(#ombra)">
    <path d="M36 40a14 14 0 0 1 14-14h120a14 14 0 0 1 14 14v34a14 14 0 0 1-14 14H74l-18 16V88h-6a14 14 0 0 1-14-14z" fill="url(#vp)"/>
  </g>
  <rect x="54" y="44" width="96" height="9" rx="4.5" fill="#fff" opacity=".95"/>
  <rect x="54" y="61" width="64" height="9" rx="4.5" fill="#fff" opacity=".7"/>

  <!-- scheda con grafico a barre -->
  <g filter="url(#ombra)">
    <rect x="150" y="96" width="170" height="118" rx="16" fill="#fff"/>
  </g>
  <rect x="168" y="112" width="70" height="8" rx="4" fill="#e6defa"/>
  <rect x="176" y="168" width="18" height="30" rx="5" fill="url(#vp)"/>
  <rect x="202" y="148" width="18" height="50" rx="5" fill="url(#po)"/>
  <rect x="228" y="134" width="18" height="64" rx="5" fill="url(#ct)"/>
  <rect x="254" y="156" width="18" height="42" rx="5" fill="url(#vp)"/>
  <rect x="280" y="140" width="18" height="58" rx="5" fill="url(#po)"/>
  <path d="M176 160 L211 138 L237 126 L263 144 L289 128" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>

  <!-- torta -->
  <g filter="url(#ombra)">
    <circle cx="86" cy="178" r="34" fill="#fff"/>
  </g>
  <path d="M86 178 L86 152 A26 26 0 0 1 110.7 186 Z" fill="#ff4f8b"/>
  <path d="M86 178 L110.7 186 A26 26 0 0 1 66 194.7 Z" fill="#ffa53d"/>
  <path d="M86 178 L66 194.7 A26 26 0 0 1 86 152 Z" fill="#7c4dff"/>

  <!-- scintille -->
  <path d="M300 30 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#ffa53d"/>
  <path d="M214 30 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#7c4dff"/>
  <path d="M30 140 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#22c3ee"/>
  <circle cx="330" cy="70" r="4" fill="#2dd4a7"/>
  <circle cx="140" cy="226" r="3" fill="#ff4f8b"/>
</svg>
